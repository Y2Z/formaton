# Publishes the demo at https://y2z.github.io/formaton/ on every push to master.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The browser tests are not run here, so Playwright needs no browsers.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build and run the engine tests
        run: npm test

      # The demo lives at demo/ and loads ../dist/ in the repository; on Pages
      # it is the front page, next to dist/.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r dist _site/dist
          sed 's#"\.\./dist/#"./dist/#g; s#'"'"'\.\./dist/#'"'"'./dist/#g' demo/index.html > _site/index.html
          grep -q "from './dist/index.js'" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
